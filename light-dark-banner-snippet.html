<!-- Example Light & Dark banner markup -->
<!-- Add data-light-dark-banner to the EXISTING hero/banner container for the campaign. -->
<!-- The rotating artwork is injected automatically; your current text/buttons stay as they are. -->
<section class="campaign-banner" data-light-dark-banner>
  <div class="campaign-banner-content">
    <span class="eyebrow">LIGHT &amp; DARK CAMPAIGN</span>
    <h1>Light &amp; Dark</h1>
    <p>A linked Empty Epsilon campaign covering fleet battles, anomalies, logistics and hostile space.</p>
  </div>
</section>
