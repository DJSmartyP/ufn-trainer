<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="menu-button" class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
      <button class="brand-button" type="button" data-nav="home" aria-label="Return to UFN Training Portal">
        <img class="brand-mark" src="assets/ufn-logo.webp" alt="United Federated Navy emblem" width="800" height="800" decoding="async" fetchpriority="high" />
        <span class="brand-copy">
          <span class="eyebrow">UNITED FEDERATED NAVY</span>
          <strong>TRAINING PORTAL</strong>
        </span>
      </button>
      <div class="link-status" aria-label="Training network status"><span class="status-dot"></span>TRAINING LINK ONLINE</div>
    </header>

    <div class="app-layout">
      <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
        <div class="side-section">
          <span class="side-label">PORTAL</span>
          <button class="nav-item" type="button" data-nav="home"><span class="nav-code" data-station-icon="directory" aria-hidden="true"></span><span>Home</span></button>
          <button class="nav-item" type="button" data-nav="general"><span class="nav-code" data-station-icon="general" aria-hidden="true"></span><span>Basic Training</span></button>
        </div>
        <div class="side-section">
          <span class="side-label">STATION TRAINING</span>
          <button class="nav-item" type="button" data-nav="captain"><span class="nav-code" data-station-icon="captain" aria-hidden="true"></span><span>Captain</span></button>
          <button class="nav-item" type="button" data-nav="helms"><span class="nav-code" data-station-icon="helms" aria-hidden="true"></span><span>Helms</span></button>
          <button class="nav-item" type="button" data-nav="weapons"><span class="nav-code" data-station-icon="weapons" aria-hidden="true"></span><span>Weapons</span></button>
          <button class="nav-item" type="button" data-nav="engineering"><span class="nav-code" data-station-icon="engineering" aria-hidden="true"></span><span>Engineering</span></button>
          <button class="nav-item" type="button" data-nav="science"><span class="nav-code" data-station-icon="science" aria-hidden="true"></span><span>Science</span></button>
          <button class="nav-item" type="button" data-nav="relay"><span class="nav-code" data-station-icon="relay" aria-hidden="true"></span><span>Relay</span></button>
        </div>
        <div class="sidebar-footer">
          <span class="micro-label">TRAINING ACCESS</span>
          <strong>CREW AUTHORISED</strong>
          <span>UFN Training Portal</span>
        </div>
      </aside>

      <main id="content" class="content" tabindex="-1"></main>
    </div>

    <footer class="site-footer">
      <span>UNITED FEDERATED NAVY // TRAINING PORTAL</span>
      <span>KNOWLEDGE IS THE FIRST DEFENCE.</span>
    </footer>
