<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#061127" />
  <meta name="description" content="United Federated Navy crew operations reference and practice terminal." />
  <title>UFN Crew Operations Network</title>
  <link rel="icon" href="assets/ufn-logo.jpg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="menu-button" class="menu-button" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
      <button class="brand-button" type="button" data-nav="home" aria-label="Return to station directory">
        <img class="brand-mark" src="assets/ufn-logo.jpg" alt="United Federated Navy emblem" />
        <span class="brand-copy">
          <span class="eyebrow">UNITED FEDERATED NAVY</span>
          <strong>CREW OPERATIONS NETWORK</strong>
        </span>
      </button>
      <div class="link-status" aria-label="Network status"><span class="status-dot"></span>FLEET LINK ONLINE</div>
    </header>

    <div class="app-layout">
      <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
        <div class="side-section">
          <span class="side-label">NETWORK</span>
          <button class="nav-item" type="button" data-nav="home"><span class="nav-code">00</span><span>Station Directory</span></button>
          <button class="nav-item" type="button" data-nav="general"><span class="nav-code">01</span><span>General Briefing</span></button>
        </div>
        <div class="side-section">
          <span class="side-label">DUTY STATIONS</span>
          <button class="nav-item" type="button" data-nav="captain"><span class="nav-code">CAP</span><span>Captain</span></button>
          <button class="nav-item" type="button" data-nav="helms"><span class="nav-code">HLM</span><span>Helms</span></button>
          <button class="nav-item" type="button" data-nav="weapons"><span class="nav-code">WPN</span><span>Weapons</span></button>
          <button class="nav-item" type="button" data-nav="engineering"><span class="nav-code">ENG</span><span>Engineering</span></button>
          <button class="nav-item" type="button" data-nav="science"><span class="nav-code">SCI</span><span>Science</span></button>
          <button class="nav-item" type="button" data-nav="relay"><span class="nav-code">RLY</span><span>Relay</span></button>
        </div>
        <div class="sidebar-footer">
          <span class="micro-label">ACCESS</span>
          <strong>CREW AUTHORISED</strong>
          <span>Frontier Operations</span>
        </div>
      </aside>

      <main id="content" class="content" tabindex="-1"></main>
    </div>

    <footer class="site-footer">
      <span>UFN FLEET COMMAND // CREW OPERATIONS NETWORK</span>
      <span>KNOWLEDGE IS THE FIRST DEFENCE.</span>
    </footer>
  </div>

  <div id="nav-scrim" class="nav-scrim" hidden></div>
  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
